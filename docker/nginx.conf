# One server for all three apps. Render routes the public traffic here (PORT=8080).
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  # CSV/XLSX imports and template uploads (the apps enforce their own limits).
  client_max_body_size 64m;

  upstream salary_app    { server 127.0.0.1:3001; }
  upstream bills_app     { server 127.0.0.1:3002; }
  upstream template_api  { server 127.0.0.1:8000; }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # PDF generation and bulk exports can be slow.
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  server {
    listen 8080;

    # ---- Template Builder API -------------------------------------------
    location /api/ {
      proxy_pass http://template_api;
    }

    # config.js is fetched on every page load; never let it be cached.
    location = /config.js {
      add_header Cache-Control "no-cache";
      try_files /config.js =404;
    }

    # ---- Salary Slip (Next.js, basePath=/salary) -------------------------
    # Note: no trailing slash on the location or the proxy target — Next.js
    # canonicalizes /salary/ <-> /salary itself, and forcing either form here
    # would loop. The full request URI passes through unchanged.
    location /salary {
      proxy_pass http://salary_app;
    }

    # ---- Bill Generator (Next.js, basePath=/bills) -----------------------
    location /bills {
      proxy_pass http://bills_app;
    }

    # ---- Template Builder frontend (static export) -----------------------
    # Old links: /templates/<id> now means /editor/?id=<id>.
    rewrite ^/templates/([^/]+)/?$ /editor/?id=$1 permanent;

    root /app/template/dist;
    index index.html;
    location / {
      try_files $uri $uri/index.html $uri.html =404;
    }
  }
}
