# Everything runs in one container; supervisord restarts whatever dies.
# Per-process environment: the entrypoint guarantees every %(ENV_...)s name
# exists (empty when not configured), so one unconfigured app never blocks
# the others.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:template-api]
directory=/app/template/backend
command=/opt/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning
environment=DATABASE_URL="%(ENV_TPL_DATABASE_URL)s",SUPABASE_URL="%(ENV_TPL_SUPABASE_URL)s",SUPABASE_SERVICE_KEY="%(ENV_TPL_SUPABASE_SERVICE_KEY)s",SUPABASE_BUCKET="templates",CORS_ORIGINS="%(ENV_TPL_CORS_ORIGINS)s",ALLOW_SIGNUP="%(ENV_TPL_ALLOW_SIGNUP)s",PYTHONUNBUFFERED="1"
autorestart=true
startsecs=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:salary]
directory=/app/salary
command=bash -c "node scripts/setup-db.mjs && exec npx next start -p 3001"
environment=DATABASE_URL="%(ENV_SALARY_DATABASE_URL)s",DIRECT_URL="%(ENV_SALARY_DIRECT_URL)s",NEXT_PUBLIC_BASE_PATH="/salary",NODE_ENV="production",HOME="/root"
autorestart=true
startsecs=20
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

[program:bills]
directory=/app/bills
command=bash -c "exec npx next start -p 3002"
environment=DATABASE_URL="%(ENV_BILL_DATABASE_URL)s",DIRECT_URL="%(ENV_BILL_DIRECT_URL)s",NEXT_PUBLIC_BASE_PATH="/bills",NEXT_PUBLIC_SUPABASE_URL="%(ENV_NEXT_PUBLIC_SUPABASE_URL)s",NEXT_PUBLIC_SUPABASE_ANON_KEY="%(ENV_NEXT_PUBLIC_SUPABASE_ANON_KEY)s",SUPABASE_SERVICE_ROLE_KEY="%(ENV_BILL_SUPABASE_SERVICE_ROLE_KEY)s",SUPABASE_STORAGE_BUCKET="%(ENV_BILL_STORAGE_BUCKET)s",NODE_ENV="production",HOME="/root"
autorestart=true
startsecs=20
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startsecs=5
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
